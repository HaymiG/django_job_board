# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/tests.yml
# Django Job Board — Run Test Suite
# ─────────────────────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Django 6.0 requires Python 3.12+ — 3.11 is not supported.
        python-version: ["3.12", "3.13"]

    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-only-insecure-secret-key-do-not-use-in-production' }}
      DJANGO_DEBUG: "1"
      DB_ENGINE: sqlite
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test accounts jobs --verbosity=2
          coverage report --show-missing

      - name: Generate coverage XML report
        run: coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
