<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    HTML Email Template Guide
    ─────────────────────────
    Email clients (Gmail, Outlook, Apple Mail) have very limited CSS support.
    Rules:
      • Use inline styles everywhere — no external stylesheets, no <style> in <head>.
      • Use tables for layout — Flexbox/Grid are not supported in most clients.
      • Avoid Google Fonts — use web-safe fonts: Arial, Georgia, Verdana, etc.
      • Keep width ≤ 600px for mobile compatibility.
      • No JavaScript — it is stripped by every mail client.
  -->
  <title>{% block title %}JobBoard{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f7fa;font-family:Arial,Helvetica,sans-serif;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f4f7fa;padding:40px 20px;">
    <tr>
      <td align="center">

        <!-- Email card (600px max) -->
        <table width="600" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;width:100%;background-color:#ffffff;
                      border-radius:12px;overflow:hidden;
                      box-shadow:0 4px 24px rgba(0,0,0,.08);">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
                       padding:32px 40px;text-align:center;">
              <p style="margin:0;font-size:28px;font-weight:700;color:#ffffff;
                        letter-spacing:-0.5px;">
                💼 JobBoard
              </p>
              <p style="margin:8px 0 0;font-size:14px;color:rgba(255,255,255,.8);">
                {% block header_subtitle %}Your career, simplified.{% endblock %}
              </p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f8fafc;border-top:1px solid #e2e8f0;
                       padding:24px 40px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#94a3b8;">
                © {% now "Y" %} JobBoard &nbsp;·&nbsp; Find roles. Hire talent.
              </p>
              <p style="margin:6px 0 0;font-size:12px;color:#cbd5e1;">
                You received this email because you have an account on JobBoard.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Email card -->

      </td>
    </tr>
  </table>
  <!-- /Outer wrapper -->

</body>
</html>
