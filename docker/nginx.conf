# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx.conf — Nginx configuration for Django Job Board
#
# Nginx sits in front of Gunicorn and does two things:
#   1. Serves static files (CSS, JS, images) and media uploads directly
#      from the shared Docker volumes — much faster than going through Django.
#   2. Proxies all other requests to Gunicorn on http://web:8000.
#
# Why not let Django serve static files?
#   Django's built-in static file server is single-threaded and not optimised
#   for production. Whitenoise is a good middle-ground, but Nginx is faster
#   for high-traffic scenarios and allows browser caching headers.
# ─────────────────────────────────────────────────────────────────────────────

upstream django_app {
    # 'web' is the Docker Compose service name — Docker's internal DNS resolves it.
    # If you scale web to multiple replicas, add more server lines here.
    server web:8000;
}

server {
    listen 80;
    server_name localhost;          # replace with your domain in production

    # Maximum upload size (resume PDFs, etc.)
    client_max_body_size 10M;

    # ── Static files ──────────────────────────────────────────────────────────
    # Served from the shared 'static_volume' Docker volume.
    # Django writes here via `collectstatic`; Nginx reads from it.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;                # browser caches for 30 days
        add_header Cache-Control "public, immutable";
    }

    # ── Media files (user uploads) ────────────────────────────────────────────
    # Served from the shared 'media_volume' Docker volume.
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # ── Everything else → Gunicorn ────────────────────────────────────────────
    location / {
        proxy_pass http://django_app;

        # Pass the real client IP to Django (available in request.META)
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for slow requests (e.g. large file uploads)
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
